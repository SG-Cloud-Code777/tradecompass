services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tradecompass
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: server/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/tradecompass
    ports: ["8787:8787"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
